<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authorization — biskwidaDev</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           max-width: 520px; margin: 80px auto; padding: 0 24px; color: #222; text-align: center; }
    h1 { font-size: 1.4rem; }
    .code-box { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 8px;
                padding: 16px; font-family: monospace; font-size: 0.95rem;
                word-break: break-all; margin: 16px 0; text-align: left; }
    .note { color: #6b7280; font-size: 0.85rem; margin-top: 24px; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <h1>Authorization Complete</h1>
  <p>Copy the code below and paste it back into the biskwidaDev app to finish connecting your account.</p>
  <div class="code-box" id="code-box">Loading...</div>
  <p class="note">You can close this tab once you've copied the code.</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const box = document.getElementById("code-box");

    if (error) {
      box.innerHTML = `<span class="error">Error: ${error}<br>${params.get("error_description") || ""}</span>`;
    } else if (code) {
      box.textContent = code;
    } else {
      box.textContent = "No authorization code found in URL.";
    }
  </script>
</body>
</html>
